name: Release

# Every merge into main is a release candidate. The version in
# src-tauri/tauri.conf.json decides whether anything actually ships: bump it in
# the PR to cut a release, leave it alone for a no-op run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two releases building at once would race for the same tag. Queue instead of
# cancelling, so an in-flight build that already created a tag can finish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        shell: bash
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged — nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new — releasing."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # The release starts as a draft so the platforms can upload into it in
  # parallel. A draft has no tag and is invisible to releases/latest, so the
  # updater never sees a release that only has one platform's installers.
  create:
    name: Create draft release
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ needs.check.outputs.version }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$VERSION" -f target_commitish="$GITHUB_SHA" -f name="$VERSION" \
            -f body="Windows and macOS installers for $VERSION." -F draft=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [check, create]
    strategy:
      # One platform failing must not leave the other publishing into a release
      # that will never go out.
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          # One universal build covers Apple Silicon and Intel Macs, and gives
          # the updater both darwin platforms from a single artifact.
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Builds the frontend (`npm run build`, so a tsc error fails the release),
      # bundles the platform's installers, signs the updater artifacts and
      # uploads them plus its entries in latest.json to the draft.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [create, build]
    runs-on: ubuntu-latest
    steps:
      # Publishing is what creates the tag, which is also what makes the next
      # run of `check` treat this version as shipped.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.create.outputs.release_id }}" -F draft=false
