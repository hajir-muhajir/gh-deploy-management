name: Release

# Every merge into main is a release candidate. The version in
# src-tauri/tauri.conf.json decides whether anything actually ships: bump it in
# the PR to cut a release, leave it alone for a no-op run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two releases building at once would race for the same tag. Queue instead of
# cancelling, so an in-flight build that already created a tag can finish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        shell: bash
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged — nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new — releasing."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build Windows installers
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Builds the frontend (`npm run build`, so a tsc error fails the release),
      # bundles the NSIS and MSI installers, signs the updater artifacts and
      # publishes the tag, the release and latest.json in one step.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.check.outputs.version }}
          releaseName: v${{ needs.check.outputs.version }}
          releaseBody: Windows installers for v${{ needs.check.outputs.version }}.
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
